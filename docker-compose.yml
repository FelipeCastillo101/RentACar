services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: rentacarv3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No exponemos el puerto 5432 al exterior por seguridad

  backend:
    build: ./backend
    restart: always
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=rentacarv3
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-no-reply@rentcar.cl}
      - WEBPAY_COMMERCE_CODE=${WEBPAY_COMMERCE_CODE:-}
      - WEBPAY_API_KEY=${WEBPAY_API_KEY:-}
      - WEBPAY_ENV=${WEBPAY_ENV:-INTEGRATION}
      - WEBPAY_RETURN_URL=${WEBPAY_RETURN_URL:-}
      - WEBPAY_FRONTEND_URL=${WEBPAY_FRONTEND_URL:-http://127.0.0.1}
      - BANK_DATA_ENCRYPTION_KEY=${BANK_DATA_ENCRYPTION_KEY:-}
      - CANCELATION_FINANCE_EMAIL=${CANCELATION_FINANCE_EMAIL:-}
    volumes:
      - media_data:/app/media

  frontend:
      build:
        context: ./frontend
        args:
          - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
          - VITE_API_BASE_URL=/api  # <--- AGREGA ESTA LÍNEA
      restart: always
      ports:
        - "80:80"
      depends_on:
        - backend

volumes:
  postgres_data:
  media_data: